# Renault Twizy longitudinal energy-model parameters
#
# IMPORTANT: Values tagged "not measured" are literature estimates or modelling
# assumptions. They are NOT HELECAR-D onboard measurements. Do not describe them
# as experimentally identified from this dataset.
#
# Main paper capacity is 6.0 kWh as specified by the HELECAR-D data descriptor
# (approximate). Manufacturer nominal energy is 6.1 kWh.

battery_capacity_kwh: 6.0
# Provenance: HELECAR-D Data in Brief (~6 kWh). Renault press kit / NaitMalek
# et al. 2022 Table 2 list 6.1 kWh. Uncertain usable vs gross. Sensitivity later:
# 5.5 / 6.0 / 6.5 kWh.

mass_kg: 549.0
# Provenance: Renault kerb weight 474 kg PLUS an assumed 75 kg occupant.
# Renault documentation lists payload around 110–115 kg; 75 kg is a modelling
# assumption for a typical driver, NOT the vehicle's maximum payload.
# Actual driver/payload on HELECAR-D is unknown.

Crr: 0.012
# Provenance: typical radial-tyre rolling-resistance coefficient used in EV
# longitudinal models. NOT measured on the HELECAR Twizy or its tyres/road.

cda_m2: 0.64
# Provenance: Renault documents report SCx / Cx ≈ 0.64 m². Model this as a
# single drag-area parameter CdA, not Cd=0.64 multiplied by a separate assumed
# frontal area. Uncertain; sensitivity later around 0.50 / 0.64 / 0.80 m².

rho_air: 1.225
# Provenance: ISA sea-level air density at 15 °C (kg/m³). Not local weather
# adjusted. Temperature is an ML covariate, not used to recompute rho by default.

eta_drive: 0.85
# Provenance: typical combined motor+inverter+gear efficiency, NOT a Twizy
# efficiency map. NaitMalek et al. 2022 mention an efficiency map but do not
# publish the numerical map used here. Uncertain.

eta_regen: 0.40
# Provenance: modelling assumption. Stock Twizy regenerative braking is widely
# reported as weak (community/OVMS documentation). NOT measured on HELECAR-D.
# Uncertain. Optional fold-wise calibration later may adjust this on TRAIN trips
# only.

auxiliary_power_kw: 0.20
# Provenance: constant P_aux assumption following NaitMalek et al. 2022 (12 V
# auxiliary battery charged from the traction battery while the key is on).
# Numerical value is NOT published as a HELECAR measurement. Uncertain.

maximum_wheel_power_kw: 13.0
# Provenance: Renault maximum *motor/mechanical* power 13 kW (17 hp).
# HELECAR-D text also mentions 12 kW. This is a WHEEL-power bound, not a
# battery-power cap. Battery discharge can exceed 13 kW because of drivetrain
# losses (P_battery ≈ P_wheel / η_drive + P_aux).

maximum_regen_wheel_power_kw: 8.0
# Provenance: bound on negative WHEEL power only, NOT measured.

g: 9.80665
# Standard gravity (m/s²).
