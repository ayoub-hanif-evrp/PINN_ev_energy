extends: ../base.yaml

# REVIEW ONLY — Tesla Model Y LR (BEV2). Does not modify paper Twizy configs.

experiment:
  profile: tesla_bev2_loto_corrected
  seed: 0
  seeds: [0, 1, 2]
  methods:
    - physics
    - ridge
    - weak_mlp
    - pinn
  retrain_outer: true
  cache: true
  test_trip_ids: null

vehicle:
  config: configs/review/vehicle_tesla_bev2.yaml

paths:
  loto_dir: review_results/tesla/loto
  cache_dir: review_results/tesla/cache

features:
  main:
    - speed_mps
    - acc_mps2
    - theta_rad
    - temperature_c
  ridge:
    - distance_km
    - duration_s
    - mean_speed_mps
    - std_speed_mps
    - max_speed_mps
    - idle_fraction
    - mean_positive_acc
    - acc_std
    - positive_acc_time_fraction
    - braking_time_fraction
    - cumulative_elevation_gain_m
    - cumulative_elevation_loss_m
    - mean_abs_grade
    - mean_temperature_c

physics:
  use_wind_as_headwind: false
  apply_power_bounds: false
  p_scale_kw: 40.0

training:
  max_epochs: 1200
  early_stopping_patience: 100
  residual_limit_kw: 40.0
  mlp_power_center_kw: 15.0
  mlp_power_half_range_kw: 80.0
  lambda_prior: 0.1
  lambda_prior_grid: [0.1]
  lambda_physics_grid: [0.1]

scarcity:
  n_train_trips: [3, 5, 8, 12]
  n_subset_repeats: 3
  seeds: [0]
  methods:
    - ridge
    - weak_mlp
    - pinn

tesla:
  vehicle: BEV2
  trips_dir: data/tesla/trips
  trip_index: data/tesla/trip_index.csv
  pool_file: review_results/tesla/pools/bev2_pool.json
  pool_size: 17
  pool_seed: 2026
  grade_assumption: flat_road_theta_0
  absurd_power_kw: 400.0
  feature_adapted: true
